name: Build Windows

# Builds only the Windows installer and keeps it as a workflow artifact (no release).
# Run it from the Actions tab, or it runs when this file changes on the custom branch.
on:
  workflow_dispatch:
  push:
    branches:
      - custom
    paths:
      - .github/workflows/build-windows.yml

env:
  BUN_VERSION: '1.2.4'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: bun install

      # The update package needs the Tauri signing key, which a fork doesn't have
      - name: Turn off update packages
        shell: bash
        run: |
          bun -e "
            const fs = require('fs');
            const file = 'apps/desktop/src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(file, 'utf8'));
            conf.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(file, JSON.stringify(conf, null, 2));
          "

      - name: Build desktop app
        shell: bash
        run: ./scripts/build-desktop.sh --target windows

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: moneywright-windows-x64
          path: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
